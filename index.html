<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Invoice Generator</h1>
            <p>Create professional invoices for your business</p>
        </header>

        <section class="invoice-section">
            <h2>Business Information</h2>

            <label for="businessName">Business Name</label>
            <input type="text" id="businessName" placeholder="Your business name">

            <label for="businessEmail">Business Email</label>
            <input type="email" id="businessEmail" placeholder="you@example.com">

            <label for="businessAddress">Business Address</label>
            <textarea id="businessAddress" placeholder="Your business address"></textarea>
        </section>

        <section class="invoice-section">
            <h2>Customer Information</h2>

            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Customer's name">

            <label for="customerEmail">Customer Email</label>
            <input type="email" id="customerEmail" placeholder="customer@example.com">

            <label for="invoiceNumber">Invoice Number</label>
            <input type="text" id="invoiceNumber" placeholder="e.g. INV-001">

            <label for="invoiceDate">Invoice Date</label>
            <input type="date" id="invoiceDate">

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate">
        </section>

        <section class="invoice-section">
            <h2>Items or Services</h2>

            <div id="itemsContainer">
                <div class="item-row">
                    <input type="text" class="item-name" placeholder="Item or service">
                    <input type="number" class="item-quantity" placeholder="Qty" min="1" value="1">
                    <input type="number" class="item-price" placeholder="Price (₦)" min="0" step="0.01">
                </div>
            </div>

            <button type="button" id="addItemBtn">+ Add Item</button>

            <div class="totals">
                <p>Subtotal: <span id="subtotal">₦0.00</span></p>
                <p><strong>Total: <span id="total">₦0.00</span></strong></p>
            </div>
        </section>

        <section class="invoice-section">
            <h2>Additional Notes</h2>
            <textarea id="notes" placeholder="Payment instructions or other notes"></textarea>
        </section>

        <button type="button" id="generateBtn">Generate Invoice</button>
        <button type="button" id="printBtn">Print / Save as PDF</button>

        <section id="invoicePreview" class="invoice-preview" hidden>
            <h2>Invoice Preview</h2>
            <div id="previewContent"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
